<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formating</title>
</head>
<body>
    <b>Bold Text</b>
    <strong>Strong Text</strong>
    <i>Italic Text</i>
    <em>Emphasis Text</em>
    <u>Underline Text</u>
    <mark>Highlighted Text</mark>
    <small>Small Text</small>
    <p>H <sub>2</sub>O</p>
    <p>X <sup>2</sup></p>


</body>
</html>
